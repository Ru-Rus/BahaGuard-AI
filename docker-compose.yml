services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bahaguard-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=BahaGuard@2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BahaGuard@2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bahaguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bahaguard-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=BahaGuardDb;User Id=sa;Password=BahaGuard@2026!;TrustServerCertificate=True;MultipleActiveResultSets=True;
    ports:
      - "5000:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - bahaguard-network

volumes:
  sqlserver_data:
    driver: local

networks:
  bahaguard-network:
    driver: bridge
